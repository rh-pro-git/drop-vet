name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools the scanner uses
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils file bubblewrap
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the drop app
        run: swiftc -O -o DropVet mac/DropVet.swift
