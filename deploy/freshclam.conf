# Unprivileged freshclam. Ubuntu's AppArmor profile for freshclam lets a normal user write only
# ~/.clamtk/db and read config from /etc/clamav or /tmp, so the unit copies this file into its
# PrivateTmp. Replace USER with your login name.
DatabaseDirectory /home/USER/.clamtk/db
DatabaseMirror database.clamav.net
Foreground yes
